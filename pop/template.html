<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>今月のおすすめPOP</title>
<style>
@font-face{font-family:"Zen";font-weight:500;src:url(fonts/Zen-500.ttf)}
@font-face{font-family:"Zen";font-weight:700;src:url(fonts/Zen-700.ttf)}
@font-face{font-family:"Zen";font-weight:900;src:url(fonts/Zen-900.ttf)}
@font-face{font-family:"Round";font-weight:800;src:url(fonts/M-800.ttf)}
@page{size:297mm 420mm;margin:0}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1123px;height:1587px;background:#fff}
body{font-family:"Zen","Noto Color Emoji",sans-serif;font-weight:700;color:var(--ink);-webkit-print-color-adjust:exact;print-color-adjust:exact}
.page{position:relative;width:1123px;height:1587px;overflow:hidden;background:
  radial-gradient(circle,var(--dot) 2.2px,transparent 2.6px) 0 0/34px 34px,var(--bg)}
.band{position:absolute;left:0;right:0;height:26px;background:var(--main)}
.band.top{top:0}.band.bottom{bottom:0}
.band::after{content:"";position:absolute;left:0;right:0;height:10px;background:
  radial-gradient(circle at 10px 0,var(--main) 9px,transparent 10px) 0 0/20px 10px repeat-x}
.band.top::after{top:26px}
.band.bottom::after{bottom:26px;transform:scaleY(-1)}
.deco{position:absolute;font-size:46px;opacity:.55;pointer-events:none}

/* 月バッジ */
.badge{position:absolute;left:70px;top:26px;width:170px;height:220px;background:var(--main);
  clip-path:polygon(0 0,100% 0,100% 78%,50% 100%,0 78%);display:flex;flex-direction:column;align-items:center;padding-top:30px;color:#fff}
.badge .en{font-family:"Round";font-size:22px;letter-spacing:.06em;background:#fff;color:var(--main);border-radius:30px;padding:3px 16px}
.badge .num{font-family:"Round";font-size:96px;line-height:1.05;margin-top:8px}
.badge .num small{font-size:44px}

/* 見出し */
.head{position:absolute;left:262px;top:50px;width:480px;white-space:nowrap;text-align:center}
.head .sub{font-size:31px;color:var(--ink);letter-spacing:.04em}
.head .who{margin-top:14px;font-size:30px}
.head .who b{font-family:"Round";font-size:58px;color:var(--main);padding:0 6px;
  background:linear-gradient(transparent 62%,var(--accent-l) 62%)}
.head .who span{font-family:"Round";font-size:38px}

/* スタッフ写真 */
.staff-bg{position:absolute;right:56px;top:200px;width:400px;height:400px;border-radius:50%;background:var(--accent-l)}
.staff-bg::after{content:"";position:absolute;inset:-16px;border-radius:50%;border:4px dashed var(--accent)}
.staff{position:absolute;right:30px;top:120px;width:460px;height:520px;display:flex;align-items:flex-end;justify-content:center}
.staff img{max-width:100%;max-height:100%;object-fit:contain;filter:drop-shadow(0 8px 14px rgba(0,0,0,.18))}
.staff .ph{width:300px;height:420px;border:4px dashed var(--main);border-radius:180px 180px 30px 30px;display:flex;align-items:center;justify-content:center;font-size:30px;color:var(--main);background:rgba(255,255,255,.6)}

/* Q&A */
.qa{position:absolute;left:46px;top:282px;width:580px;display:flex;flex-direction:column;gap:12px}
.qa .lab{display:inline-block;background:var(--sub);color:#fff;font-size:20px;padding:5px 20px;border-radius:24px 24px 24px 0;position:relative;z-index:1}
.qa .txt{margin-top:-4px;background:var(--card);border-radius:0 40px 40px 40px;padding:11px 26px;font-size:22px;line-height:1.4;box-shadow:0 4px 0 var(--sub-l)}

/* 共通カード */
.card{position:absolute;background:#fff;border:4px solid var(--c);border-radius:28px;box-shadow:0 6px 0 var(--c-l)}
.ribbon{position:absolute;top:-30px;left:50%;transform:translateX(-50%);background:var(--c);color:#fff;font-family:"Round";font-size:36px;
  padding:6px 44px;border-radius:40px;white-space:nowrap;box-shadow:0 4px 0 var(--c-d)}
.kanji{position:absolute;width:150px;height:150px;border-radius:50%;background:var(--c);color:#fff;font-family:"Round";font-size:92px;
  display:flex;align-items:center;justify-content:center;border:7px solid #fff;box-shadow:0 0 0 4px var(--c)}
.point{display:flex;align-items:flex-start;gap:10px;background:var(--c-l);border-radius:16px;padding:12px 16px;font-size:20px;line-height:1.45}
.point i{flex:none;font-style:normal;background:var(--c-d);color:#fff;font-size:16px;padding:3px 12px;border-radius:14px;margin-top:2px}

/* 食 */
.food{--c:var(--food);--c-l:var(--food-l);--c-d:var(--food-d);left:40px;right:40px;top:688px;height:356px}
.food .kanji{left:44px;top:36px}
.food .ing{position:absolute;left:20px;top:210px;width:200px;text-align:center;font-size:19px;line-height:1.35}
.food .ing b{display:inline-block;font-family:"Round";font-size:42px;color:var(--c-d);margin-top:4px}
.food .ing em{font-style:normal;font-size:40px;margin-left:6px}
.food .mat{position:absolute;left:250px;top:44px;width:255px}
.food h4{font-family:"Round";font-size:22px;color:var(--c-d);text-align:center;border-bottom:3px dotted var(--c);padding-bottom:4px;margin-bottom:10px}
.food .mat li{list-style:none;display:flex;justify-content:space-between;font-size:19px;line-height:1.6}
.food .mat li span:first-child::before{content:"●";color:var(--c);font-size:12px;margin-right:6px;vertical-align:3px}
.food .how{position:absolute;left:530px;top:44px;right:30px}
.food .how ol{list-style:none;counter-reset:s;font-size:18px;line-height:1.45}
.food .how ol li{counter-increment:s;padding-left:34px;position:relative;margin-bottom:4px}
.food .how ol li::before{content:counter(s);position:absolute;left:0;top:2px;width:25px;height:25px;border-radius:50%;background:var(--c);color:#fff;font-size:15px;text-align:center;line-height:25px}
.food .how .point{margin-top:8px;font-size:18px;padding:10px 14px}
.food .dishimg{position:absolute;right:-14px;top:-70px;width:190px;height:190px;border-radius:50%;object-fit:cover;border:7px solid #fff;box-shadow:0 0 0 4px var(--c)}
.food.has-img .how{right:200px}

/* 筋・整 */
.mini{left:40px;width:680px;height:215px}
.mini .kanji{right:-30px;top:-36px;width:124px;height:124px;font-size:74px}
.mini .ribbon{left:40px;transform:none}
.mini .body{position:absolute;left:24px;right:24px;top:38px;bottom:16px;gap:10px;display:flex;flex-direction:column;justify-content:space-between}
.mini .row{display:flex;gap:20px;align-items:center;flex:1}
.mini .row img{width:150px;height:96px;object-fit:cover;border-radius:16px;flex:none}
.mini .desc{flex:1;font-size:20px;line-height:1.45;text-align:center;padding-right:70px}
.mini .point{font-size:17px;padding:7px 12px;margin-right:70px}
.train{--c:var(--train);--c-l:var(--train-l);--c-d:var(--train-d);top:1092px}
.stretch{--c:var(--str);--c-l:var(--str-l);--c-d:var(--str-d);top:1338px}

/* スマホ + QR */
.phone{position:absolute;right:46px;top:1076px;width:315px;height:478px;background:#2b2b2b;border-radius:44px;padding:14px}
.phone .scr{width:100%;height:100%;background:#fff;border-radius:32px;display:flex;flex-direction:column;align-items:center;padding:22px 16px 0;overflow:hidden}
.phone .ig{display:flex;align-items:center;gap:8px;white-space:nowrap;font-family:"Round";font-size:21px;color:var(--ink)}
.phone .ig .logo{width:40px;height:40px;border-radius:12px;background:radial-gradient(circle at 30% 107%,#fdf497 0%,#fd5949 45%,#d6249f 60%,#285AEB 90%);position:relative}
.phone .ig .logo::before{content:"";position:absolute;inset:9px;border:3px solid #fff;border-radius:50%}
.phone .ig .logo::after{content:"";position:absolute;inset:5px;border:3px solid #fff;border-radius:10px}
.phone .id{font-size:15px;color:#888;margin:6px 0 4px}
.phone .msg{font-size:19px;color:var(--main);margin-bottom:8px}
.phone img{width:250px;height:250px;margin-top:4px;image-rendering:pixelated}
</style>
</head>
<body>
<div class="page" id="page"></div>
<script>
// 月ごとの季節カラー（main=帯・バッジ, sub=Q&Aラベル, food/train/str=各カード）
const THEMES = {
  1:{name:"お正月",deco:["🎍","❄️","⛄"],bg:"#fff9f4",main:"#d9485f",sub:"#c79a3a",food:"#e8a33d",train:"#d9485f",str:"#5aa88a"},
  2:{name:"バレンタイン",deco:["💝","❄️","🍫"],bg:"#fff6f7",main:"#d7728a",sub:"#8b5e4a",food:"#e39a5c",train:"#d7728a",str:"#7fb3c8"},
  3:{name:"春",deco:["🌸","🌷","🍡"],bg:"#fff8f8",main:"#e88aa3",sub:"#86b86b",food:"#f0a95a",train:"#e88aa3",str:"#86b86b"},
  4:{name:"桜",deco:["🌸","🌱","🐝"],bg:"#fffafb",main:"#ef8fae",sub:"#7cc29a",food:"#f2b45d",train:"#ef8fae",str:"#7cc29a"},
  5:{name:"新緑",deco:["🌿","🍃","🌼"],bg:"#f8fcf4",main:"#5eaf7a",sub:"#f0a35e",food:"#f0a35e",train:"#e97f8f",str:"#5eaf7a"},
  6:{name:"紫陽花",deco:["☔","🐌","💧"],bg:"#f7f8fd",main:"#7f8fd6",sub:"#b18cd6",food:"#e9a05c",train:"#7f8fd6",str:"#6fbcb2"},
  7:{name:"夏",deco:["🌻","🍉","☀️"],bg:"#f4fbff",main:"#3fa7d6",sub:"#f2a541",food:"#f2a541",train:"#ef6f6c",str:"#3fa7d6"},
  8:{name:"夏祭り",deco:["🎐","🍧","🌻"],bg:"#f6fbff",main:"#2f94c8",sub:"#ef6f6c",food:"#f2a541",train:"#ef6f6c",str:"#4bb39a"},
  9:{name:"お月見",deco:["🌕","🍡","🌾"],bg:"#fffaf0",main:"#d99a3b",sub:"#7c6aa6",food:"#d99a3b",train:"#c8665a",str:"#7c6aa6"},
  10:{name:"秋",deco:["🍁","🌰","🍂"],bg:"#fffbea",main:"#8e6aa6",sub:"#8e6aa6",food:"#e2a83a",train:"#c9727f",str:"#5fbf98"},
  11:{name:"晩秋",deco:["🍂","🍁","☕","❄️"],bg:"#fff8ef",main:"#d9796a",sub:"#a87452",food:"#e3a640",train:"#d9796a",str:"#7fae84"},
  12:{name:"クリスマス",deco:["🎄","⛄","❄️","🎁"],bg:"#fbf9f5",main:"#c9474f",sub:"#3f8f6a",food:"#e2a13b",train:"#c9474f",str:"#3f8f6a"}
};
const EN=["","January","February","March","April","May","June","July","August","September","October","November","December"];

function mix(hex,amt,to){ // amt:0..1 白(to=255)または黒(to=0)へ寄せる
  const n=parseInt(hex.slice(1),16),c=[n>>16,(n>>8)&255,n&255].map(v=>Math.round(v+(to-v)*amt));
  return "#"+c.map(v=>v.toString(16).padStart(2,"0")).join("");
}
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const br=s=>esc(s).replace(/\n/g,"<br>");

function render(d){
  const t=THEMES[d.month], r=document.documentElement.style;
  r.setProperty("--bg",t.bg); r.setProperty("--dot",mix(t.main,.86,255));
  r.setProperty("--ink",mix(t.sub,.55,0)); r.setProperty("--card",mix(t.sub,.86,255));
  for(const k of ["main","sub","food","train","str"]){
    r.setProperty("--"+k,t[k]); r.setProperty("--"+k+"-l",mix(t[k],.82,255)); r.setProperty("--"+k+"-d",mix(t[k],.25,0));
  }
  r.setProperty("--accent",t.food); r.setProperty("--accent-l",mix(t.food,.7,255));
  const prev=d.month===1?12:d.month-1;
  const labels=["最近ハマっているもの",`${prev}月の思い出`,`${d.month}月に楽しみなこと`];
  const decoPos=[[4,250,-15],[1072,60,20],[4,600,10],[1074,640,-10],[4,1035,15],[760,40,-12]];
  const f=d.food, mini=(cls,k,x)=>`
    <div class="card mini ${cls}">
      <div class="ribbon">${esc(x.name)}</div><div class="kanji">${k}</div>
      <div class="body">
        <div class="row">${x.photo?`<img src="${x.photo}">`:""}<div class="desc">${br(x.desc)}</div></div>
        <div class="point"><i>ポイント</i><div>${br(x.point)}</div></div>
      </div>
    </div>`;
  document.getElementById("page").innerHTML=`
    <div class="band top"></div><div class="band bottom"></div>
    ${decoPos.map((p,i)=>`<div class="deco" style="left:${p[0]}px;top:${p[1]}px;transform:rotate(${p[2]}deg)">${t.deco[i%t.deco.length]}</div>`).join("")}
    <div class="badge"><div class="en">${EN[d.month]}</div><div class="num">${d.month}<small>月</small></div></div>
    <div class="head"><div class="sub">＼ スタッフのおすすめ紹介 ／</div>
      <div class="who">今月は <b>${esc(d.trainer)}</b><span>トレーナー</span></div></div>
    <div class="staff-bg"></div>
    <div class="staff">${d.photo?`<img src="${d.photo}">`:`<div class="ph">スタッフ写真</div>`}</div>
    <div class="qa">${d.qa.map((a,i)=>`<div><div class="lab">${labels[i]}</div><div class="txt">${br(a)}</div></div>`).join("")}</div>
    <div class="card food${f.photo?" has-img":""}">
      <div class="ribbon">${esc(f.dish)}</div>
      ${f.photo?`<img class="dishimg" src="${f.photo}">`:""}
      <div class="kanji">食</div>
      <div class="ing">今月のおすすめ食材は<b>${esc(f.ingredient)}</b><em>${f.emoji||""}</em></div>
      <div class="mat"><h4>材料（${esc(f.servings)}）</h4><ul>${f.materials.map(m=>`<li><span>${esc(m[0])}</span><span>${esc(m[1])}</span></li>`).join("")}</ul></div>
      <div class="how"><h4>作り方</h4><ol>${f.steps.map(s=>`<li>${esc(s)}</li>`).join("")}</ol>
        <div class="point"><i>ポイント</i><div>${br(f.point)}</div></div></div>
    </div>
    ${mini("train","筋",d.training)}
    ${mini("stretch","整",d.stretch)}
    <div class="phone"><div class="scr">
      <div class="ig"><div class="logo"></div>レガーメ Instagram</div>
      <div class="id">@gymlegame_kotoni</div>
      <div class="msg">＼ 最新情報を投稿中！ ／</div>
      <img src="${d.qr}">
      <div class="id" style="margin-top:10px;font-size:16px">📱 スマホで読み取ってね</div>
    </div></div>`;
}
if(window.POP_DATA) render(window.POP_DATA);
</script>
</body>
</html>
