<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>今月のおすすめPOP</title>
<style>
@font-face{font-family:"Zen";font-weight:500;src:url(fonts/Zen-500.ttf)}
@font-face{font-family:"Zen";font-weight:700;src:url(fonts/Zen-700.ttf)}
@font-face{font-family:"Zen";font-weight:900;src:url(fonts/Zen-900.ttf)}
@font-face{font-family:"Serif";font-style:italic;font-weight:600;src:url(fonts/Cormorant-600.ttf)}
@page{size:297mm 420mm;margin:0}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1123px;height:1587px;background:#fff}
body{font-family:"Zen",sans-serif;font-weight:700;color:var(--ink);letter-spacing:.03em;-webkit-print-color-adjust:exact;print-color-adjust:exact}
.page{position:relative;width:1123px;height:1587px;overflow:hidden;background:var(--bg)}
.band{position:absolute;left:0;right:0;height:16px;background:var(--main)}
.band.top{top:0}.band.bottom{bottom:0}
.leaf{position:absolute;pointer-events:none}
.en{font-family:"Serif";font-style:italic;font-weight:600;letter-spacing:.04em}

/* 月バッジ（10月版と同じ五角形） */
.badge{position:absolute;left:64px;top:16px;width:150px;height:190px;background:var(--main);
  clip-path:polygon(0 0,100% 0,100% 80%,50% 100%,0 80%);display:flex;flex-direction:column;align-items:center;padding-top:22px;color:#fff}
.badge .en{font-size:27px;border-bottom:1px solid rgba(255,255,255,.7);padding:0 6px 2px}
.badge .num{font-weight:900;font-size:76px;line-height:1.1;margin-top:4px}
.badge .num small{font-size:34px;margin-left:2px}

/* 見出し */
.head{position:absolute;left:250px;top:46px;white-space:nowrap}
.head .sub{font-size:26px;font-weight:700;letter-spacing:.12em}
.head .who{margin-top:14px;font-size:28px;display:flex;align-items:baseline;gap:10px}
.head .who b{font-weight:900;font-size:54px;color:var(--main);padding:0 4px;
  background:linear-gradient(transparent 70%,var(--main-l) 70%)}
.head .who span{font-weight:900;font-size:36px}

/* スタッフ写真 */
.staff-bg{position:absolute;right:70px;top:150px;width:390px;height:390px;border-radius:50%;background:var(--main-l);opacity:.7}
.staff{position:absolute;right:40px;top:90px;width:450px;height:520px;display:flex;align-items:flex-end;justify-content:center}
.staff img{max-width:100%;max-height:100%;object-fit:contain}
.staff .ph{width:300px;height:400px;border:2px solid var(--main);border-radius:150px 150px 20px 20px;display:flex;align-items:center;justify-content:center;font-size:24px;color:var(--main);background:rgba(255,255,255,.5)}

/* Q&A */
.qa{position:absolute;left:44px;top:250px;width:575px;display:flex;flex-direction:column;gap:10px}
.qa .lab{display:inline-block;background:var(--sub);color:#fff;font-size:17px;padding:4px 18px;border-radius:20px;letter-spacing:.08em}
.qa .txt{margin-top:5px;background:var(--card);border-radius:28px;padding:10px 24px;font-size:21px;line-height:1.45}

/* 共通カード */
.card{position:absolute;background:#fff;border:2px solid var(--c);border-radius:22px}
.ribbon{position:absolute;top:-24px;background:var(--c);color:#fff;font-weight:900;font-size:27px;letter-spacing:.06em;
  padding:6px 34px;border-radius:30px;white-space:nowrap}
.kanji{position:absolute;width:118px;height:118px;border-radius:50%;background:var(--c);color:#fff;font-weight:900;font-size:66px;
  display:flex;align-items:center;justify-content:center;outline:2px solid var(--c);outline-offset:5px}
.point{display:flex;align-items:flex-start;gap:10px;background:var(--c-l);border-radius:12px;padding:9px 14px;font-size:17px;line-height:1.5}
.point i{flex:none;font-style:normal;color:var(--c-d);border:1.5px solid var(--c-d);font-size:13px;padding:1px 10px;border-radius:12px;margin-top:2px;background:#fff}

/* 食 */
.food{--c:var(--food);--c-l:var(--food-l);--c-d:var(--food-d);left:40px;right:40px;top:640px;height:272px}
.food .ribbon{left:50%;transform:translateX(-50%)}
.food .kanji{left:52px;top:30px}
.food .ing{position:absolute;left:18px;top:176px;width:190px;text-align:center;font-size:16px;line-height:1.3}
.food .ing b{display:block;font-weight:900;font-size:34px;color:var(--c-d);margin-top:2px}
.food .mat{position:absolute;left:232px;top:34px;width:250px}
.food h4{font-size:18px;color:var(--c-d);text-align:center;border-bottom:1.5px solid var(--c);padding-bottom:3px;margin-bottom:7px;letter-spacing:.1em}
.food .mat li{list-style:none;display:flex;justify-content:space-between;font-size:16px;line-height:1.58;border-bottom:1px dotted var(--c-l)}
.food .how{position:absolute;left:508px;top:34px;right:26px}
.food .how ol{list-style:none;counter-reset:s;font-size:16px;line-height:1.45}
.food .how ol li{counter-increment:s;padding-left:30px;position:relative;margin-bottom:2px}
.food .how ol li::before{content:counter(s);position:absolute;left:0;top:3px;width:21px;height:21px;border-radius:50%;background:var(--c);color:#fff;font-size:13px;text-align:center;line-height:21px}
.food .how .point{margin-top:6px;font-size:16px;padding:7px 12px}
.food .dishimg{position:absolute;right:-10px;top:-50px;width:170px;height:170px;border-radius:50%;object-fit:cover;border:5px solid #fff;outline:2px solid var(--c)}
.food.has-img .how{right:180px}

/* 筋・整 */
.mini{left:40px;width:700px;height:252px}
.mini .ribbon{left:34px}
.mini .kanji{right:26px;top:-34px}
.mini .body{position:absolute;left:26px;right:26px;top:44px;bottom:20px;display:flex;flex-direction:column;justify-content:space-between;gap:12px}
.mini .row{display:flex;gap:22px;align-items:center;flex:1}
.mini .row img{width:220px;height:130px;object-fit:cover;border-radius:12px;flex:none}
.mini .desc{flex:1;font-size:21px;line-height:1.65;text-align:center}
.train{--c:var(--train);--c-l:var(--train-l);--c-d:var(--train-d);top:948px}
.stretch{--c:var(--str);--c-l:var(--str-l);--c-d:var(--str-d);top:1258px}

/* スマホ（10月版と同じ：Instagram画面のスクショ＋QR） */
.phone{position:absolute;right:50px;top:920px;width:308px;height:641px;background:#1d1d1f;border-radius:50px;padding:13px;box-shadow:0 0 0 3px #8e8e93}
.phone::before,.phone::after{content:"";position:absolute;width:4px;background:#8e8e93;border-radius:2px}
.phone::before{left:-7px;top:120px;height:60px;box-shadow:0 80px 0 #8e8e93}
.phone::after{right:-7px;top:160px;height:90px}
.phone .scr{position:relative;width:100%;height:100%;background:#fff;border-radius:38px;overflow:hidden;padding-top:24px}
.phone .scr img{display:block;width:100%}
.phone .notch{position:absolute;left:50%;top:0;transform:translateX(-50%);width:130px;height:30px;background:#1d1d1f;border-radius:0 0 18px 18px}
.phone .notch::after{content:"";position:absolute;right:26px;top:9px;width:10px;height:10px;border-radius:50%;background:#3a3a3c}
.phone .fallback{display:flex;flex-direction:column;align-items:center;gap:14px;padding-top:30px;font-size:18px}
.phone .fallback img{width:230px}
</style>
</head>
<body>
<div class="page" id="page"></div>
<script>
// 月ごとの季節カラー（大人っぽく落ち着いたトーン）。main=帯・バッジ・名前, sub=Q&Aラベル, leaf=植物の線画
const THEMES = {
  1:{bg:"#fbf8f4",main:"#b5545c",sub:"#a08657",food:"#c49a4e",train:"#b5545c",str:"#6f9488",leaf:"#9bb0a4"},
  2:{bg:"#fbf7f6",main:"#b8707a",sub:"#8b6b5c",food:"#c58f63",train:"#b8707a",str:"#7f9db0",leaf:"#c7a9ad"},
  3:{bg:"#fcf8f7",main:"#c98593",sub:"#8aa37c",food:"#d3a466",train:"#c98593",str:"#8aa37c",leaf:"#a9bd9f"},
  4:{bg:"#fdf9f8",main:"#d0899c",sub:"#7fa991",food:"#d4a868",train:"#d0899c",str:"#7fa991",leaf:"#b5cbb9"},
  5:{bg:"#f8faf4",main:"#6f9c7c",sub:"#c79a6b",food:"#cf9e5d",train:"#c27f86",str:"#6f9c7c",leaf:"#9fbf9f"},
  6:{bg:"#f7f8fb",main:"#7d88b8",sub:"#9a84b5",food:"#c99a64",train:"#7d88b8",str:"#6fa39d",leaf:"#a9b4cf"},
  7:{bg:"#f5f9fb",main:"#4f8fb0",sub:"#cf9b52",food:"#cf9b52",train:"#c9706a",str:"#4f8fb0",leaf:"#9cc0cf"},
  8:{bg:"#f6f9fb",main:"#3f7fa3",sub:"#c9706a",food:"#cf9b52",train:"#c9706a",str:"#5f9e8e",leaf:"#9cc0cf"},
  9:{bg:"#fcf9f2",main:"#b78a4a",sub:"#7d6f9b",food:"#c3954f",train:"#b06b60",str:"#7d6f9b",leaf:"#c7b48f"},
  10:{bg:"#fffcef",main:"#8c6fa0",sub:"#8c6fa0",food:"#d4a43c",train:"#b97a85",str:"#62b195",leaf:"#a7bf9a"},
  11:{bg:"#fbf7f1",main:"#b3705f",sub:"#8b7262",food:"#c4964a",train:"#b3705f",str:"#7b9a7e",leaf:"#a9b39a"},
  12:{bg:"#faf8f4",main:"#a8484f",sub:"#4f7d66",food:"#c3974c",train:"#a8484f",str:"#4f7d66",leaf:"#8fae9c"}
};
const EN=["","January","February","March","April","May","June","July","August","September","October","November","December"];

function mix(hex,amt,to){ // amt:0..1 白(to=255)または黒(to=0)へ寄せる
  const n=parseInt(hex.slice(1),16),c=[n>>16,(n>>8)&255,n&255].map(v=>Math.round(v+(to-v)*amt));
  return "#"+c.map(v=>v.toString(16).padStart(2,"0")).join("");
}
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const br=s=>esc(s).replace(/\n/g,"<br>");

// 植物の枝（線画）。x,y=位置, size=長さ, rot=角度
function branch(x,y,size,rot,color,flip){
  const leaves=[];
  for(let i=0;i<7;i++){
    const t=0.12+i*0.13, px=t*100, py=50-Math.sin(t*Math.PI)*14, s=1-i*0.08;
    for(const side of [-1,1]){
      if(i===6&&side===1) continue;
      leaves.push(`<ellipse cx="0" cy="${-11*s}" rx="${5.2*s}" ry="${11*s}" transform="translate(${px} ${py}) rotate(${side*48-20+i*4})"/>`);
    }
  }
  return `<svg class="leaf" style="left:${x}px;top:${y}px;width:${size}px;height:${size}px;transform:rotate(${rot}deg)${flip?" scaleX(-1)":""}" viewBox="0 0 100 100">
    <g fill="none" stroke="${color}" stroke-width="1.1" stroke-linecap="round">
      <path d="M2 52 Q50 26 104 50"/>${leaves.join("")}</g></svg>`;
}

function render(d){
  const t=THEMES[d.month], r=document.documentElement.style;
  r.setProperty("--bg",t.bg);
  r.setProperty("--ink",mix(t.sub,.62,0)); r.setProperty("--card",mix(t.main,.88,255));
  for(const k of ["main","sub","food","train","str"]){
    r.setProperty("--"+k,t[k]); r.setProperty("--"+k+"-l",mix(t[k],.84,255)); r.setProperty("--"+k+"-d",mix(t[k],.22,0));
  }
  const prev=d.month===1?12:d.month-1;
  const labels=["最近ハマっているもの",`${prev}月の思い出`,`${d.month}月に楽しみなこと`];
  const f=d.food, mini=(cls,k,x)=>`
    <div class="card mini ${cls}">
      <div class="ribbon">${esc(x.name)}</div><div class="kanji">${k}</div>
      <div class="body">
        <div class="row">${x.photo?`<img src="${x.photo}">`:""}<div class="desc">${br(x.desc)}</div></div>
        <div class="point"><i>ポイント</i><div>${br(x.point)}</div></div>
      </div>
    </div>`;
  document.getElementById("page").innerHTML=`
    <div class="band top"></div><div class="band bottom"></div>
    ${branch(-50,880,170,-35,t.leaf)}${branch(950,-30,210,60,t.leaf,true)}${branch(735,1440,170,-30,t.leaf)}
    <div class="badge"><div class="en">${EN[d.month]}</div><div class="num">${d.month}<small>月</small></div></div>
    <div class="head"><div class="sub">＼ スタッフのおすすめ紹介 ／</div>
      <div class="who">今月は <b>${esc(d.trainer)}</b><span>トレーナー</span></div></div>
    <div class="staff-bg"></div>
    <div class="staff">${d.photo?`<img src="${d.photo}">`:`<div class="ph">スタッフ写真</div>`}</div>
    <div class="qa">${d.qa.map((a,i)=>`<div><div class="lab">${labels[i]}</div><div class="txt">${br(a)}</div></div>`).join("")}</div>
    <div class="card food${f.photo?" has-img":""}">
      <div class="ribbon">${esc(f.dish)}</div>
      ${f.photo?`<img class="dishimg" src="${f.photo}">`:""}
      <div class="kanji">食</div>
      <div class="ing">今月のおすすめ食材は<b>${esc(f.ingredient)}</b></div>
      <div class="mat"><h4>材料（${esc(f.servings)}）</h4><ul>${f.materials.map(m=>`<li><span>${esc(m[0])}</span><span>${esc(m[1])}</span></li>`).join("")}</ul></div>
      <div class="how"><h4>作り方</h4><ol>${f.steps.map(s=>`<li>${esc(s)}</li>`).join("")}</ol>
        <div class="point"><i>ポイント</i><div>${br(f.point)}</div></div></div>
    </div>
    ${mini("train","筋",d.training)}
    ${mini("stretch","整",d.stretch)}
    <div class="phone"><div class="scr"><div class="notch"></div>
      ${d.phone?`<img src="${d.phone}">`:`<div class="fallback">＼ 受付きょんがいろいろ投稿中 ／<img src="${d.qr}"></div>`}
    </div></div>`;
}
if(window.POP_DATA) render(window.POP_DATA);
</script>
</body>
</html>
