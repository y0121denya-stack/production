<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>傾斜禁止ポップ（白・文言B）</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@500;700;900&display=swap" rel="stylesheet">
<style>
  /* 印刷サイズ：A5横（210×148mm）＝一般的なトレッドミル操作パネルの約1/6 */
  @page { size: 210mm 148mm; margin: 0; }
  :root { --bg:#ffffff; --green:#12b347; --green-dim:#0b8a35; --white:#111111; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { background: #d9d9d9; }
  body { font-family: "Noto Sans JP", "IPAGothic", sans-serif; display: grid; place-items: center; min-height: 100vh; padding: 16px; }
  .pop {
    width: 210mm; height: 148mm; background: var(--bg); color: var(--white);
    position: relative; overflow: hidden;
    display: grid; grid-template-columns: 66mm 1fr; align-items: center; gap: 6mm;
    padding: 12mm 12mm 16mm 14mm;
    -webkit-print-color-adjust: exact; print-color-adjust: exact;
  }
  .pop::before { /* 緑の枠 */
    content: ""; position: absolute; inset: 5mm; border: 1.4mm solid var(--green); border-radius: 4mm;
  }
  .stripe { position: absolute; left: 0; right: 0; bottom: 0; height: 7mm;
    background: repeating-linear-gradient(-45deg, var(--green) 0 5mm, var(--bg) 5mm 10mm); }
  .icon { width: 66mm; height: 66mm; position: relative; z-index: 1; }
  .text { position: relative; z-index: 1; }
  .label { display: inline-block; background: var(--green); color: #ffffff; font-weight: 900;
    font-size: 5mm; letter-spacing: .4em; padding: 1mm 3mm 1mm 4mm; border-radius: 1mm; margin-bottom: 4mm; }
  h1 { font-weight: 900; line-height: 1.3; font-size: 11.5mm; letter-spacing: -.02em; }
  h1 em { font-style: normal; color: var(--green); }
  .sub { margin-top: 5mm; font-size: 5.6mm; font-weight: 700; line-height: 1.5; }
  .sub b { color: var(--green); }
  .en { margin-top: 5mm; font-size: 3.6mm; font-weight: 500; color: #666666; letter-spacing: .03em; }
  .brand { position: absolute; right: 10mm; bottom: 9.5mm; z-index: 1; font-size: 3.2mm; font-weight: 700;
    color: var(--green); letter-spacing: .08em; background: var(--bg); padding: 0 2mm; }
  @media print { html, body { background: none; } body { padding: 0; display: block; min-height: 0; } }
</style>
</head>
<body>
  <div class="pop">
    <svg class="icon" viewBox="0 0 200 200" aria-hidden="true">
      <circle cx="100" cy="100" r="90" fill="none" stroke="#12b347" stroke-width="13"/>
      <!-- 傾斜の角度（くさび） -->
      <polygon points="40,138 158,138 158,98" fill="#12b347" fill-opacity=".22"/>
      <line x1="40" y1="138" x2="158" y2="138" stroke="#12b347" stroke-width="4" stroke-dasharray="8 6"/>
      <!-- 傾斜したトレッドミル（横から見た図） -->
      <g fill="none" stroke="#111111" stroke-width="10" stroke-linecap="round" stroke-linejoin="round">
        <line x1="40" y1="138" x2="158" y2="98"/>
        <polyline points="146,102 140,56 118,56"/>
      </g>
      <!-- 禁止の斜線 -->
      <line x1="36" y1="36" x2="164" y2="164" stroke="#12b347" stroke-width="13" stroke-linecap="round"/>
    </svg>
    <div class="text">
      <span class="label">お願い</span>
      <h1><em>傾斜</em>を付けないでの<br>ご利用を<br>お願いいたします</h1>
      <p class="en">Please do not use the incline.</p>
    </div>
    <div class="stripe"></div>
    <div class="brand">絆Style-gym Legame</div>
  </div>
</body>
</html>
